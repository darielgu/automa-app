<!doctype html>
<html>
  <body>
    <form id="application-form">
      <section class="ashby-application-form-field-entry" data-field-path="internship.availability">
        <div class="ashby-application-form-question-title">Internships are for 5 to 6 months from July onward. Are you available for this period?</div>
        <label><input type="radio" name="internship_window" value="yes">Yes</label>
        <label><input type="radio" name="internship_window" value="no">No</label>
      </section>

      <section class="ashby-application-form-field-entry" data-field-path="location.availability">
        <div class="ashby-application-form-question-title">Please confirm which location(s) you would be available to work from ?</div>
        <label><input type="checkbox" name="location_options" value="Paris">Paris</label>
        <label><input type="checkbox" name="location_options" value="Bordeaux">Bordeaux</label>
        <label><input type="checkbox" name="location_options" value="Barcelona">Barcelona</label>
        <label><input type="checkbox" name="location_options" value="Berlin">Berlin</label>
        <div id="loc-err" class="ashby-application-form-error">This field is required. Please choose at least one location.</div>
      </section>

      <input id="loc-input-proxy" aria-invalid="true" aria-describedby="loc-err" />
    </form>
  </body>
</html>
